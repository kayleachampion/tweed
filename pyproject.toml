[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tweed"
version = "0.1.0"
description = "Markdown-native academic life and lab management"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.16",
    "rich>=14",
    "python-frontmatter>=1.1",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
tweed = "tweed.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
